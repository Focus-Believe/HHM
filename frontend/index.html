<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat App</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login">
  <h2>Chat App</h2>

  <input id="name" placeholder="Username" autocomplete="off">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="app" style="display:none;">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="sidebar-header">
      <div>Users</div>
    </div>

    <!-- FUTURE: search users -->
    <input id="search" placeholder="Search users..." class="search-box">

    <div id="users" class="users"></div>

  </div>

  <!-- ================= CHAT AREA ================= -->
  <div class="chat">

    <!-- HEADER -->
    <div id="header" class="chat-header">
      Select a user to start chat
    </div>

    <!-- FUTURE: typing indicator -->
    <div id="typing" class="typing"></div>

    <!-- MESSAGES -->
    <div id="messages" class="messages"></div>

    <!-- INPUT BOX -->
    <div class="input-box">

      <input id="msg"
        placeholder="Type message..."
        autocomplete="off"
        oninput="typing()">

      <button onclick="send()">➤</button>

    </div>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="/static/app.js"></script>

<!-- ================= UX FEATURES ================= -->
<script>

  // ENTER TO SEND MESSAGE
  document.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      let msg = document.getElementById("msg");
      if(msg && msg.value.trim() !== ""){
        send();
      }
    }
  });

  // FUTURE: typing indicator hook
  function typing(){
    // ws.send({type:"typing", to:target})
  }

</script>

</body>
  </html>
