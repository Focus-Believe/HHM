<!DOCTYPE html>
<html lang="en">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat App</title>

<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login">

  <div class="login-box">

    <h2>Chat App</h2>

    <input id="name" placeholder="Username" autocomplete="off">
    <input id="pass" type="password" placeholder="Password">

    <div class="btn-group">
      <button onclick="login()">Login</button>
      <button onclick="register()">Register</button>
    </div>

  </div>

</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="app" style="display:none;">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="sidebar-header">
      💬 Chats
    </div>

    <!-- SEARCH -->
    <input
      id="search"
      class="search"
      placeholder="Search users..."
      oninput="filterUsers()"
    >

    <!-- USERS LIST -->
    <div id="users" class="users"></div>

  </div>

  <!-- ================= CHAT AREA ================= -->
  <div class="chat">

    <!-- HEADER -->
    <div id="header" class="chat-header">
      Select a user
    </div>

    <!-- ONLINE + TYPING STATUS -->
    <div class="status-bar">
      <span id="onlineStatus"></span>
      <span id="typing"></span>
    </div>

    <!-- MESSAGES -->
    <div id="messages" class="messages"></div>

    <!-- INPUT AREA -->
    <div class="input-area">

      <!-- MESSAGE INPUT -->
      <input
        id="msg"
        placeholder="Type message..."
        autocomplete="off"
        oninput="typing()"
      >

      <!-- SEND BUTTON -->
      <button onclick="send()">➤</button>

    </div>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="/static/app.js"></script>

<!-- ================= EXTRA FEATURES ================= -->
<script>

  // =====================
  // ENTER KEY SEND
  // =====================
  document.addEventListener("keydown", (e) => {

    if (e.key === "Enter") {

      const msg = document.getElementById("msg");

      if (msg && msg.value.trim() !== "") {
        send();
      }
    }
  });

  // =====================
  // USER SEARCH
  // =====================
  function filterUsers() {

    const value = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".user").forEach(u => {

      const name = u.innerText.toLowerCase();

      u.style.display = name.includes(value) ? "flex" : "none";
    });
  }

  // =====================
  // ONLINE STATUS UI (HOOK READY)
  // =====================
  function setOnlineStatus(text) {
    document.getElementById("onlineStatus").innerText = text;
  }

</script>

</body>
                               </html>
