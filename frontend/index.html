<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat App</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login">

  <h2>Chat App</h2>

  <input id="name" placeholder="Username" autocomplete="off">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>

</div>

<!-- ================= APP ================= -->
<div id="app" class="app" style="display:none;">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="sidebar-header">
      <div>💬 Chats</div>
    </div>

    <!-- SEARCH USERS -->
    <input
      id="search"
      placeholder="Search users..."
      class="search-box"
      oninput="searchUsers()"
    >

    <div id="users" class="users"></div>

  </div>

  <!-- ================= CHAT AREA ================= -->
  <div class="chat">

    <!-- HEADER -->
    <div id="header" class="chat-header">
      Select a user to start chat
    </div>

    <!-- TYPING INDICATOR -->
    <div id="typing" class="typing"></div>

    <!-- MESSAGES -->
    <div id="messages" class="messages"></div>

    <!-- INPUT -->
    <div class="input-box">

      <input
        id="msg"
        placeholder="Type message..."
        autocomplete="off"
        oninput="typing()"
      >

      <button onclick="send()">➤</button>

    </div>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="/static/app.js"></script>

<!-- ================= FUTURE UX FEATURES ================= -->
<script>

  // ENTER TO SEND
  document.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

      let msg = document.getElementById("msg");

      if(msg && msg.value.trim() !== ""){
        send();
      }
    }
  });

  // =====================
  // SEARCH USERS (FUTURE READY)
  // =====================
  function searchUsers(){

    let input = document.getElementById("search").value.toLowerCase();
    let users = document.querySelectorAll(".user");

    users.forEach(u => {

      let name = u.innerText.toLowerCase();

      if(name.includes(input)){
        u.style.display = "block";
      } else {
        u.style.display = "none";
      }
    });
  }

  // =====================
  // TYPING INDICATOR HOOK
  // =====================
  function typing(){

    // future websocket feature
    // ws.send(JSON.stringify({
    //   type:"typing",
    //   to: target
    // }));

    let box = document.getElementById("typing");
    box.innerText = "typing...";
    
    clearTimeout(window.typingTimeout);

    window.typingTimeout = setTimeout(() => {
      box.innerText = "";
    }, 1000);
  }

</script>

</body>
        </html>
